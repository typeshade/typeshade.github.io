name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/shader-dsl is the compiler; the page is built from it.
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The build runs scripts/check-style.mjs, check-copy.ts and check-api.ts first; see
      # DESIGN.md.
      - run: bun run build
      # The translations are typed against the English copy; a missing string fails here.
      - run: bun run check:types
      # Only a 404 or 410 fails this step. A 403, 429 or timeout is a rate-limited runner.
      - run: bun run qa:links
      - run: bun run qa:seo
      # OpenSEO's audit engine over dist, pinned; see scripts/openseo-audit.mts.
      - run: bun run qa:openseo
      # Enable Pages with the Actions source on the first run. The custom domain is set once
      # in Settings, after the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
