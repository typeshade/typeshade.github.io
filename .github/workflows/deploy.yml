name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/shader-dsl is the compiler; the page is built from it.
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The build runs scripts/check-style.mjs, check-copy.ts and check-api.ts first; see
      # DESIGN.md.
      - run: bun run build
      # The Playground is the one page whose worth is that it runs: it is a compiler behind an
      # editor, and a build stays green while the page throws on its first line. Chromium opens
      # dist/ and checks it. Monaco itself comes from jsdelivr, so a runner with no route there
      # reports that on its own; see the note at the top of scripts/check-playground.mjs.
      - run: bunx playwright install --with-deps chromium
      - run: bun run check:playground
      # The translations are typed against the English copy; a missing string fails here.
      - run: bun run check:types
      # Only a 404 or 410 fails this step. A 403, 429 or timeout is a rate-limited runner.
      - run: bun run qa:links
      - run: bun run qa:seo
      # OpenSEO's audit engine over dist, pinned; see scripts/openseo-audit.mts.
      - run: bun run qa:openseo
      # Pages is only configured for deployment runs on main; PRs still execute every build/QA check above.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
