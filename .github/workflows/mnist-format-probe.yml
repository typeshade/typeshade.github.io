name: MNIST temporary source formatting
on:
  pull_request:
    paths:
      - 'src/scripts/mnist-*'
      - 'src/i18n/en.ts'
      - 'src/i18n/ko.ts'
      - 'src/components/MnistTrainer.astro'
      - 'src/components/pages/MnistPage.astro'
      - '.github/workflows/mnist-format-probe.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format project additions and expose exact UTF8 bytes
        run: |
          bunx prettier --write src/scripts/mnist-browser.ts src/scripts/mnist-engine.ts src/scripts/mnist-dataset.ts src/components/MnistTrainer.astro src/components/pages/MnistPage.astro src/i18n/en.ts src/i18n/ko.ts
          for file in src/scripts/mnist-browser.ts src/scripts/mnist-engine.ts src/scripts/mnist-dataset.ts src/components/MnistTrainer.astro src/components/pages/MnistPage.astro src/i18n/en.ts src/i18n/ko.ts; do
            echo "MNIST_BEGIN:$file"
            base64 -w76 "$file"
            echo ""
            echo "MNIST_END:$file"
          done
