name: Temporary official MNIST formatting
on:
  pull_request:
    paths:
      - 'src/scripts/mnist-dataset.ts'
      - 'scripts/check-mnist-browser.mjs'
      - '.github/workflows/mnist-official-format.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write src/scripts/mnist-dataset.ts scripts/check-mnist-browser.mjs
          for file in src/scripts/mnist-dataset.ts scripts/check-mnist-browser.mjs; do
            echo "MNIST_BEGIN:$file"
            base64 -w76 "$file"
            echo ""
            echo "MNIST_END:$file"
          done
