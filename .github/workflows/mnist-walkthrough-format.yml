name: Temporary MNIST tutorial source formatting
on:
  pull_request:
    paths:
      - 'scripts/check-mnist-browser.mjs'
      - 'src/i18n/**'
      - '.github/workflows/mnist-walkthrough-format.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write scripts/check-mnist-browser.mjs src/i18n/en.ts src/i18n/ko.ts
          for file in scripts/check-mnist-browser.mjs src/i18n/en.ts src/i18n/ko.ts; do
            echo "MNIST_BEGIN:$file"
            base64 -w76 "$file"
            echo ""
            echo "MNIST_END:$file"
          done
