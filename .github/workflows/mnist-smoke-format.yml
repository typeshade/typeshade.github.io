name: Temporary MNIST smoke-test formatting
on:
  pull_request:
    paths:
      - 'scripts/check-mnist-browser.mjs'
      - '.github/workflows/mnist-smoke-format.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write scripts/check-mnist-browser.mjs
          echo MNIST_SMOKE_BEGIN
          base64 -w76 scripts/check-mnist-browser.mjs
          echo ""
          echo MNIST_SMOKE_END
